[package]
# 改为你的模块 ID（只含小写字母、数字和下划线）
# Change to your module ID (lowercase letters, digits, underscores only)
# 同时修改下方 [[bin]].name，保持一致
# Also update [[bin]].name below to match
name = "my_module"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "my_module"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
